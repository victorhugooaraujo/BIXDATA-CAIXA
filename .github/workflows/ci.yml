name: CI
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: caixa_test
          MYSQL_USER: caixa
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: test_root_password
        ports: ["3306:3306"]
        options: >-
          --health-cmd="MYSQL_PWD=test_password mysql -h 127.0.0.1 -ucaixa -Dcaixa_test -e 'SELECT 1'"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      TEST_DATABASE_URL: mysql+pymysql://caixa:test_password@127.0.0.1:3306/caixa_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.1"
          python-version: "3.15.0"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pytest
