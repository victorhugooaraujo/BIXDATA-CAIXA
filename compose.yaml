services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-caixa}
      MYSQL_USER: ${MYSQL_USER:-caixa}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Copie .env.example para .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Copie .env.example para .env}
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER -D$$MYSQL_DATABASE -e 'SELECT 1'"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
  app:
    build: .
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-caixa}:${MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-caixa}?charset=utf8mb4"
      TORCH_HOME: /app/.cache/torch
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./artifacts:/app/artifacts
      - torch_cache:/app/.cache/torch
volumes:
  mysql_data:
  torch_cache:
