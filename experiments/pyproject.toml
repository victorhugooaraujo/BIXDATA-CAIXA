[project]
name = "caixa-ml-lab"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "numpy>=2.4,<3",
  "pillow>=12,<14",
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "python-dotenv>=1.1,<2",
  "sqlalchemy>=2.0,<3",
  "pymysql[rsa]>=1.1,<2",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cuda" }

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
